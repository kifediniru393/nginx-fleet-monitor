version: 2
project_name: nginx-fleet-exporter

builds:
  - main: ./cmd/nginx-fleet-exporter
    binary: nginx-fleet-exporter
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - deploy/*

checksum:
  name_template: checksums.txt

release:
  draft: false

changelog:
  use: github
