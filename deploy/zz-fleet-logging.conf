# nginx-fleet-exporter ingress log — additive drop-in, no existing conf changes.
# Install: copy to /etc/nginx/conf.d/zz-fleet-logging.conf && nginx -t && nginx -s reload
# Remove:  delete this file and reload. Existing access_log directives are unaffected;
# nginx emits to every configured access_log, so this is a second, parallel log.
log_format fleet escape=json '{"host":"$host","upstream":"$upstream_addr",'
    '"bytes_sent":$bytes_sent,"request_length":$request_length,'
    '"status":$status,"upstream_time":"$upstream_response_time"}';
access_log /var/log/nginx/fleet.log fleet;
