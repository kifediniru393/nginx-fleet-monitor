# Config-hygiene recording/alerting rules (plan §4.5 / §6).
# The last-traffic timestamp metrics arrive with the Phase 2 ingress collector;
# these rules are shipped ahead so the contract is fixed.
#
# Decommission window: 5 days (432000s), per operations policy 2026-08.
# Keep in sync with the exporter's --decommission-window flag
# (exposed as nginx_fleet_decommission_window_seconds).

groups:
  - name: nginx-fleet-hygiene
    rules:
      - record: nginx_fleet:upstream_idle_seconds
        expr: time() - nginx_fleet_upstream_last_traffic_timestamp_seconds

      - alert: NginxUpstreamDecommissionCandidate
        expr: |
          (time() - nginx_fleet_upstream_last_traffic_timestamp_seconds)
            > nginx_fleet_decommission_window_seconds
        for: 1h
        labels:
          severity: info
        annotations:
          summary: >-
            Upstream {{ $labels.upstream_addr }} (vhost {{ $labels.vhost }}) has
            served no traffic for over 5 days — decommission candidate.

      - alert: NginxVhostDecommissionCandidate
        expr: |
          (time() - nginx_fleet_vhost_last_traffic_timestamp_seconds)
            > nginx_fleet_decommission_window_seconds
        for: 1h
        labels:
          severity: info
        annotations:
          summary: >-
            vhost {{ $labels.vhost }} has served no traffic for over 5 days —
            decommission candidate.

      # Intent-vs-actual drift, joined via upstream_member_info (config
      # hostname -> resolved IP, the identity ingress observes in logs).

      # Configured member with zero observed traffic while its vhost IS
      # serving: down, backup, weight-starved, or dead config.
      - alert: NginxUpstreamMemberReceivingNoTraffic
        expr: |
          (
            nginx_fleet_upstream_member_info
            unless on (vhost, upstream_addr)
              label_replace(nginx_fleet_upstream_requests_total,
                            "upstream_addr", "$1", "upstream_addr", "(.*)")
          )
          and on (vhost) (rate(nginx_fleet_ingress_requests_total[30m]) > 0)
        for: 6h
        labels:
          severity: info
        annotations:
          summary: >-
            Configured member {{ $labels.upstream_addr }} of vhost
            {{ $labels.vhost }} receives no traffic while the vhost serves.

      # Traffic observed to an address no configured member resolves to:
      # stale DNS, manual proxy_pass edit, or config removed while running.
      - alert: NginxTrafficToUnconfiguredUpstream
        expr: |
          sum by (vhost, upstream_addr) (rate(nginx_fleet_upstream_requests_total[30m])) > 0
          unless on (vhost, upstream_addr)
            label_replace(nginx_fleet_upstream_member_info,
                          "upstream_addr", "$1", "upstream_ip", "(.*)")
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: >-
            vhost {{ $labels.vhost }} sends traffic to
            {{ $labels.upstream_addr }}, which no configured upstream resolves to.

      - alert: NginxVRRPSplitBrain
        expr: |
          count by (vrid) (
            max by (vrid, node) (nginx_fleet_vrrp_master) == 1
          ) > 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "VRID {{ $labels.vrid }}: more than one node advertising as master."

      # TLS certificate hygiene — probed via SNI against the local listener,
      # measuring the certificate clients actually receive.
      - alert: NginxVhostCertExpiringSoon
        expr: |
          (nginx_fleet_vhost_cert_expiry_timestamp_seconds - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: >-
            Certificate served for {{ $labels.vhost }}:{{ $labels.listen_port }}
            expires in under 14 days.

      - alert: NginxVhostServingWrongCert
        expr: nginx_fleet_vhost_cert_san_match == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.vhost }}:{{ $labels.listen_port }} serves a certificate
            that is not valid for its own name (SNI/config bug).

      # A cluster member counts as healthy only if its exporter reports live
      # nginx workers. Fires when a pair is silently running without a
      # standby — the state both reboot incidents left behind.
      - alert: NginxClusterNoHealthyStandby
        expr: |
          count by (segment, vrid) (
            max by (segment, vrid, instance) (nginx_fleet_cluster_info)
            and on (instance) max by (instance) (nginx_fleet_worker_fds_open)
          ) < 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: >-
            Cluster vrid {{ $labels.vrid }} has fewer than 2 members with a
            running nginx — a failover now would blackhole its VIP.

      # Pair members serving different certificates for the same vhost:
      # invisible to clients until a failover swaps which cert they get.
      - alert: NginxVhostCertDrift
        expr: |
          (max by (vhost, listen_port) (nginx_fleet_vhost_cert_expiry_timestamp_seconds)
           - min by (vhost, listen_port) (nginx_fleet_vhost_cert_expiry_timestamp_seconds)) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.vhost }}:{{ $labels.listen_port }} serves different
            certificates depending on which pair member is active.
