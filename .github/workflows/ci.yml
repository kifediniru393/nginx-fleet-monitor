name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build ./cmd/nginx-fleet-exporter
          GOOS=linux GOARCH=arm64 go build ./cmd/nginx-fleet-exporter
