name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      # staticcheck omitted for now: current release cannot analyze go1.26 modules yet
      - run: go test -race ./...
      - name: Fuzz smoke (VRRP parser)
        run: go test -fuzz=FuzzParse -fuzztime=20s ./internal/vrrp
      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build ./cmd/nginx-fleet-exporter
          GOOS=linux GOARCH=arm64 go build ./cmd/nginx-fleet-exporter
